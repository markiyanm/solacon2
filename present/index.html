<!DOCTYPE html>
<html lang="en" class="booth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Present | SolaCon 2</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#010623">
  <link rel="icon" href="/assets/sola-logo-reverse.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/site.css">
  <script src="/assets/site.js"></script>
  <style>
    body {
      display: block;
      height: 100vh;
      overflow: hidden;
    }

    body.idle { cursor: none; }

    /* One ring for the whole deck; it glides to each slide's spot. */
    .ring.ready {
      transition:
        left 1.6s var(--ease-in-out),
        top 1.6s var(--ease-in-out),
        width 1.6s var(--ease-in-out);
    }

    .slides iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s, visibility 0.4s;
    }

    .slides iframe.active {
      opacity: 1;
      visibility: visible;
      transition-delay: 0.15s;
    }

    .progress {
      position: fixed;
      left: 0;
      bottom: 0;
      height: 3px;
      width: 0;
      background: var(--sola-blue);
      box-shadow: 0 0 12px rgba(0, 71, 255, 0.8);
    }

    /* Top right: the one corner every slide leaves empty. */
    .qr {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      width: 8rem;
      padding: 0.6rem 0.6rem 0.5rem;
      background: #fff;
      border-radius: 1rem;
      color: var(--ink);
      font-size: 0.8rem;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 1rem 2.5rem rgba(0, 0, 0, 0.45);
    }

    .qr img {
      display: block;
      width: 100%;
      margin-bottom: 0.2rem;
    }

    .controls {
      position: fixed;
      left: 50%;
      bottom: 1.5rem;
      translate: -50% 0;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 0.75rem;
      background: rgba(10, 18, 56, 0.92);
      border: 1px solid var(--line);
      border-radius: 999px;
      transition: opacity 0.3s;
    }

    body.idle .controls { opacity: 0; pointer-events: none; }

    .controls button {
      min-width: 2.25rem;
      height: 2.25rem;
      padding: 0 0.5rem;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 1rem;
      cursor: pointer;
    }

    .controls button:hover { background: rgba(244, 246, 255, 0.12); }

    .dots { display: flex; gap: 0.45rem; }

    /* Each dot is a tiny Sola ring; the current slide's ring is filled. */
    .dots button {
      min-width: 0;
      width: 0.8rem;
      height: 0.8rem;
      padding: 0;
      box-shadow: inset 0 0 0 2px rgba(124, 157, 255, 0.5);
      transition: box-shadow 0.3s;
    }

    .dots button[aria-current="true"] { box-shadow: inset 0 0 0 0.4rem var(--sola-blue); }

    .controls label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .controls input {
      width: 3.5rem;
      padding: 0.2rem 0.4rem;
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      background: transparent;
      color: var(--text);
      font: inherit;
    }
  </style>
</head>
<body>
  <div class="ring" aria-hidden="true"><b></b><i class="ripple"></i><i class="ripple"></i><i class="tap"></i></div>

  <div class="slides"></div>

  <div class="progress"></div>

  <div class="qr">
    <img src="/assets/qr-site.svg" alt="QR code for solacon2.solapayments.dev">
    <span>Scan to explore</span>
  </div>

  <div class="controls">
    <button type="button" data-action="prev" title="Previous (Left arrow)" aria-label="Previous slide">&larr;</button>
    <div class="dots"></div>
    <button type="button" data-action="next" title="Next (Right arrow)" aria-label="Next slide">&rarr;</button>
    <button type="button" data-action="pause" title="Pause (Space)" aria-label="Pause">&#10074;&#10074;</button>
    <label>Every <input type="number" min="3" step="1" aria-label="Seconds per slide"> sec</label>
    <button type="button" data-action="fullscreen" title="Fullscreen (F)" aria-label="Fullscreen">&#x26F6;</button>
  </div>

  <script>
    // Seconds per slide: ?interval=N in the URL wins, then the last value set here, then 20.
    const params = new URLSearchParams(location.search);
    let interval = Number(params.get('interval')) || Number(localStorage.getItem('solacon2.interval')) || 20;

    const ring = document.querySelector('.ring');
    const tap = ring.querySelector('.tap');
    const slides = document.querySelector('.slides');
    const dots = document.querySelector('.dots');
    const progress = document.querySelector('.progress');
    const pauseButton = document.querySelector('[data-action="pause"]');
    const intervalInput = document.querySelector('.controls input');

    const frames = SOLA_PAGES.map((page, i) => {
      const frame = document.createElement('iframe');
      frame.src = page.path + '?present';
      frame.title = page.title;
      slides.append(frame);

      const dot = document.createElement('button');
      dot.type = 'button';
      dot.title = page.title;
      dot.setAttribute('aria-label', page.title);
      dot.addEventListener('click', () => show(i));
      dots.append(dot);

      return frame;
    });

    let current = -1;
    let elapsed = 0;
    let paused = false;
    // Video slides advance when the video ends. If the video goes quiet (it can't
    // play, say), the slide falls back to the timer so the deck never stalls.
    let lastVideoSignal = 0;
    const videoPlaying = () => SOLA_PAGES[current].video && Date.now() - lastVideoSignal < 5000;

    function show(i) {
      i = (i + frames.length) % frames.length;
      if (i !== current) {
        if (current >= 0) frames[current].contentWindow.postMessage({ type: 'leave' }, location.origin);
        current = i;
        lastVideoSignal = Date.now();
        frames.forEach((frame, j) => frame.classList.toggle('active', j === current));
        [...dots.children].forEach((dot, j) => dot.setAttribute('aria-current', j === current));
        solaPlaceRing(ring, SOLA_PAGES[current].ring);
        showQr(SOLA_PAGES[current].qr);

        // A tap ripple as the ring lands, and the slide's own entrance.
        tap.style.animation = 'none';
        void tap.offsetWidth;
        tap.style.animation = 'tap 1.4s var(--ease-out) 1.2s';
        frames[current].contentWindow.postMessage({ type: 'enter' }, location.origin);
      }
      elapsed = 0;
    }

    // Most slides send visitors to the start; a slide with its own qr sends them straight there.
    const qrImage = document.querySelector('.qr img');
    const qrCaption = document.querySelector('.qr span');
    const siteQr = { src: qrImage.getAttribute('src'), alt: qrImage.alt, caption: qrCaption.textContent };
    function showQr(qr) {
      qrImage.src = qr ? qr.src : siteQr.src;
      qrImage.alt = qr ? `QR code for solacon2.solapayments.dev${SOLA_PAGES[current].path}` : siteQr.alt;
      qrCaption.textContent = qr ? qr.caption : siteQr.caption;
    }

    function setPaused(value) {
      paused = value;
      pauseButton.innerHTML = paused ? '&#9654;' : '&#10074;&#10074;';
      pauseButton.setAttribute('aria-label', paused ? 'Play' : 'Pause');
      if (SOLA_PAGES[current].video) {
        lastVideoSignal = Date.now();
        frames[current].contentWindow.postMessage({ type: paused ? 'pause' : 'play' }, location.origin);
      }
    }

    function setSlideSeconds(seconds) {
      interval = Math.max(3, seconds || 20);
      intervalInput.value = interval;
      localStorage.setItem('solacon2.interval', interval);
    }

    function handleKey(key) {
      if (key === 'ArrowRight' || key === 'PageDown') show(current + 1);
      else if (key === 'ArrowLeft' || key === 'PageUp') show(current - 1);
      else if (key === ' ') setPaused(!paused);
      else if (key === 'f' || key === 'F') toggleFullscreen();
    }

    function toggleFullscreen() {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }

    // Advance on a 100ms tick so pausing and manual navigation both reset cleanly.
    setInterval(() => {
      if (paused) lastVideoSignal = Date.now();
      if (videoPlaying()) return;
      if (!paused) elapsed += 100;
      progress.style.width = Math.min(100, (elapsed / (interval * 1000)) * 100) + '%';
      if (elapsed >= interval * 1000) show(current + 1);
    }, 100);

    document.querySelector('.controls').addEventListener('click', e => {
      const action = e.target.closest('[data-action]')?.dataset.action;
      if (action === 'prev') show(current - 1);
      else if (action === 'next') show(current + 1);
      else if (action === 'pause') setPaused(!paused);
      else if (action === 'fullscreen') toggleFullscreen();
    });

    intervalInput.addEventListener('change', () => setSlideSeconds(Number(intervalInput.value)));
    intervalInput.addEventListener('keydown', e => e.stopPropagation());

    document.addEventListener('keydown', e => {
      if (e.key === ' ') e.preventDefault();
      handleKey(e.key);
    });

    // Slides forward link clicks and key presses (see assets/site.js).
    window.addEventListener('message', e => {
      if (e.origin !== location.origin) return;
      if (e.data.type === 'key') handleKey(e.data.key);
      if (e.data.type === 'goto') {
        const i = SOLA_PAGES.findIndex(p => p.path === e.data.path);
        if (i >= 0) show(i);
      }
      // Only the slide on screen drives the progress bar.
      if (e.source !== frames[current].contentWindow) return;
      if (e.data.type === 'video-progress') {
        lastVideoSignal = Date.now();
        progress.style.width = e.data.value * 100 + '%';
      }
      if (e.data.type === 'video-ended' && !paused) show(current + 1);
    });

    // Hide the controls and cursor when the mouse is still.
    let idleTimer;
    function wake() {
      document.body.classList.remove('idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
    }
    document.addEventListener('mousemove', wake);
    frames.forEach(frame => frame.addEventListener('load', () => {
      frame.contentDocument.addEventListener('mousemove', wake);
    }));

    setSlideSeconds(interval);
    show(0);
    requestAnimationFrame(() => ring.classList.add('ready'));
    wake();
  </script>
</body>
</html>
