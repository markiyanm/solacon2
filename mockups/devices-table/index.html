<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mockup B: Device comparison | SolaCon 2</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#010623">
  <link rel="icon" href="/assets/sola-logo-reverse.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/site.css">
  <script src="/assets/site.js"></script>
  <script src="/assets/devices.js"></script>
  <style>
    .table-wrap {
      overflow-x: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 1rem;
    }

    table {
      width: 100%;
      min-width: 60rem;
      border-collapse: collapse;
      text-align: center;
    }

    th, td {
      padding: 0.75rem 0.5rem;
      border-bottom: 1px solid var(--line);
    }

    tr:last-child td { border-bottom: 0; }

    tbody th {
      position: sticky;
      left: 0;
      background: var(--surface);
      color: var(--text-muted);
      font-weight: 600;
      text-align: left;
      white-space: nowrap;
      padding-left: 1.25rem;
    }

    thead th { vertical-align: bottom; padding-top: 1.25rem; }

    thead img {
      display: block;
      height: 6.25rem;
      width: 100%;
      margin-bottom: 0.75rem;
      object-fit: contain;
      filter: drop-shadow(0 0.75rem 1rem rgba(0, 0, 0, 0.5));
    }

    thead .name { display: block; font-size: 1rem; }

    thead .kind { display: block; color: var(--sola-blue-light); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }

    td { color: var(--text-muted); font-size: 0.9rem; }

    .yes {
      display: inline-grid;
      place-items: center;
      width: 1.6rem;
      height: 1.6rem;
      border-radius: 999px;
      background: var(--sola-blue);
      color: #fff;
      font-weight: 700;
    }

    .no { color: rgba(255, 255, 255, 0.3); }

    .common {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
      color: var(--text-muted);
    }

    .common strong { color: #fff; }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="/"><img src="/assets/sola-logo-reverse.svg" alt="Sola Payments"></a>
  </header>

  <main class="slide">
    <div>
      <p class="eyebrow">Sola Terminal &middot; Supported devices</p>
      <h1>The right device <em>for every counter.</em></h1>
    </div>

    <div class="table-wrap">
      <table></table>
    </div>

    <p class="common"><strong>Every device:</strong></p>
  </main>

  <nav class="page-nav" aria-label="Pages"></nav>

  <script>
    const check = value => (value ? '<span class="yes" aria-label="Yes">&#10003;</span>' : '<span class="no" aria-label="No">&mdash;</span>');
    const row = (label, cell) => `<tr><th scope="row">${label}</th>${SOLA_DEVICES.map(d => `<td>${cell(d)}</td>`).join('')}</tr>`;

    document.querySelector('table').innerHTML = `
      <thead>
        <tr>
          <th></th>
          ${SOLA_DEVICES.map(d => `
            <th scope="col">
              <img src="${d.image}" alt="">
              <span class="kind">${d.formFactor}</span>
              <span class="name">${d.name}</span>
            </th>`).join('')}
        </tr>
      </thead>
      <tbody>
        ${row('Battery', d => check(d.battery))}
        ${row('Printer', d => check(d.printer))}
        ${row('Physical keypad', d => check(d.keypad))}
        ${row('Connectivity', d => d.connectivity)}
        ${row('Best for', d => d.bestFor)}
      </tbody>`;

    document.querySelector('.common').innerHTML += SOLA_DEVICE_COMMON.map(f => `<span>${f}</span>`).join('');
  </script>
</body>
</html>
