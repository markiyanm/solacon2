<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mockup A: Device gallery | SolaCon 2</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#010623">
  <link rel="icon" href="/assets/sola-logo-reverse.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/site.css">
  <script src="/assets/site.js"></script>
  <script src="/assets/devices.js"></script>
  <style>
    .devices {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 11rem), 1fr));
    }

    @media (min-width: 900px) {
      .devices { grid-template-columns: repeat(4, 1fr); }
    }

    .device {
      display: grid;
      grid-template-rows: 8rem auto;
      gap: 0.75rem;
      padding: 1rem 1.25rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 1rem;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
    }

    .device:hover, .device:focus-visible { border-color: var(--sola-blue-light); transform: translateY(-2px); outline: none; }

    .present .tap-hint { display: none; }

    .device img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0.75rem 1.25rem rgba(0, 0, 0, 0.5));
    }

    .device h2 { font-size: 1.1rem; }

    .device .kind { color: var(--sola-blue-light); font-size: 0.85rem; font-weight: 700; }

    .tags { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.5rem; }

    .tag {
      padding: 0.15em 0.6em;
      border-radius: 999px;
      background: rgba(124, 157, 255, 0.14);
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    dialog {
      width: min(92vw, 56rem);
      margin: auto;
      padding: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 1.25rem;
      color: #fff;
    }

    dialog::backdrop { background: rgba(1, 6, 35, 0.8); backdrop-filter: blur(4px); }

    .detail {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 2rem;
      padding: 2rem;
    }

    @media (max-width: 700px) {
      .detail { grid-template-columns: 1fr; }
      dialog .detail img { max-height: 12rem; }
    }

    .detail img {
      width: 100%;
      max-height: 26rem;
      object-fit: contain;
      filter: drop-shadow(0 1rem 2rem rgba(0, 0, 0, 0.6));
    }

    .detail h2 { font-size: 2rem; }

    .specs {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.5rem 1.25rem;
      margin: 1.25rem 0;
    }

    .specs dt { color: var(--text-muted); }

    .close {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      width: 2.25rem;
      height: 2.25rem;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1.25rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="/"><img src="/assets/sola-logo-reverse.svg" alt="Sola Payments"></a>
  </header>

  <main class="slide">
    <div>
      <p class="eyebrow">Sola Terminal &middot; Supported devices</p>
      <h1>Runs on the PAX devices <em>merchants want.</em></h1>
      <p class="lede tap-hint">Tap a device to see what it can do.</p>
    </div>

    <div class="devices"></div>
  </main>

  <dialog>
    <button class="close" type="button" aria-label="Close">&times;</button>
    <div class="detail"></div>
  </dialog>

  <nav class="page-nav" aria-label="Pages"></nav>

  <script>
    const yesNo = value => (value ? 'Yes' : 'No');
    const dialog = document.querySelector('dialog');

    document.querySelector('.devices').innerHTML = SOLA_DEVICES.map(d => `
      <button class="device" type="button" data-id="${d.id}">
        <img src="${d.image}" alt="PAX ${d.name}">
        <div>
          <p class="kind">${d.formFactor}</p>
          <h2>PAX ${d.name}</h2>
          <div class="tags">
            ${d.battery ? '<span class="tag">Battery</span>' : ''}
            ${d.printer ? '<span class="tag">Printer</span>' : ''}
            ${d.keypad ? '<span class="tag">Keypad</span>' : ''}
          </div>
        </div>
      </button>`).join('');

    document.querySelector('.devices').addEventListener('click', e => {
      const d = SOLA_DEVICES.find(x => x.id === e.target.closest('.device')?.dataset.id);
      if (!d) return;
      dialog.querySelector('.detail').innerHTML = `
        <img src="${d.image}" alt="PAX ${d.name}">
        <div>
          <p class="eyebrow">${d.formFactor}</p>
          <h2>PAX ${d.name}</h2>
          <p class="lede">Best for: ${d.bestFor}</p>
          <dl class="specs">
            <dt>Battery</dt><dd>${yesNo(d.battery)}${d.note ? ` (${d.note.toLowerCase()})` : ''}</dd>
            <dt>Printer</dt><dd>${yesNo(d.printer)}</dd>
            <dt>Physical keypad</dt><dd>${yesNo(d.keypad)}</dd>
            <dt>Connectivity</dt><dd>${d.connectivity}</dd>
          </dl>
          <ul class="checks">${SOLA_DEVICE_COMMON.map(f => `<li>${f}</li>`).join('')}</ul>
        </div>`;
      dialog.showModal();
    });

    dialog.querySelector('.close').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', e => { if (e.target === dialog) dialog.close(); });
  </script>
</body>
</html>
