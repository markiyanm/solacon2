<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SolaCon 2 - Product | Sola Payments</title>
  <meta name="description" content="SolaCon 2 product information from Sola Payments.">
  <meta name="theme-color" content="#010623">
  <link rel="icon" href="assets/sola-logo-reverse.svg" type="image/svg+xml">
  <style>
    :root {
      --sola-blue: #0047ff;
      --sola-navy: #010623;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem 1.5rem;
      background: var(--sola-navy);
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }

    .logo {
      width: min(60vw, 240px);
      height: auto;
    }

    h1 {
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 700;
      line-height: 1.1;
    }

    h1 span {
      display: block;
      color: var(--sola-blue);
    }
  </style>
</head>
<body>
  <img class="logo" src="assets/sola-logo-reverse.svg" alt="Sola Payments">
  <h1>SolaCon 2 <span>Product</span></h1>
</body>
</html>
